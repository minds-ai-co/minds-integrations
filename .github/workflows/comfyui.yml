name: ComfyUI node pack

on:
  pull_request:
    paths: ['apps/comfyui/**', '.github/workflows/comfyui.yml']
  push:
    branches: [main]
    paths: ['apps/comfyui/**', '.github/workflows/comfyui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/comfyui/scripts/widget-build
      - run: apps/comfyui/scripts/widget-build/node_modules/.bin/playwright install --with-deps chromium
      - run: node apps/comfyui/scripts/test_response_layout.mjs
      - run: node apps/comfyui/scripts/test_inputs_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ComfyUI-response-layout
          path: /tmp/minds-comfy-response-layout
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r apps/comfyui/requirements.txt ruff numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check apps/comfyui && ruff format --check apps/comfyui
      - run: python -m unittest discover -s apps/comfyui/tests -v
        env:
          PYTHONPATH: apps/comfyui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apps/comfyui/tests/*.test.mjs
      - run: python apps/comfyui/scripts/package.py /tmp/ComfyUI-Minds.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ComfyUI-Minds-${{ matrix.python }}
          path: /tmp/ComfyUI-Minds.zip
