name: Shopify package metadata
on: pull_request
permissions:
  contents: read
  packages: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm view @minds-ai-co/locales@1.0.0-staging.41 dist --json > shopify-package-dist.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: shopify-package-dist
          path: shopify-package-dist.json
