[project]
name = "comfyui-minds"
version = "0.2.3"
description = """
Official Minds integration for ComfyUI: compare image and video creative preferences with selected AI-powered Audiences in one node.

Connect images, videos with audio, hosted media or text concepts. Review the draft, see rankings and findings in the embedded Minds widget, then send selected original media downstream with audio preserved. Use it for ads, thumbnails, packaging and creative revisions.

Requires a Minds account, ready Audiences and a server-side API key. Compare 2–20 alternatives. Results estimate synthetic preferences, not clicks or sales. Scroll inside results with the wheel or trackpad.

Guide: https://getminds.ai/guide/integration-comfyui
Workflow: https://raw.githubusercontent.com/minds-ai-co/ComfyUI-Minds/main/docs/images/workflow.png
Results: https://raw.githubusercontent.com/minds-ai-co/ComfyUI-Minds/main/docs/images/response.png
"""
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["comfyui", "creative-testing", "audience-preferences", "synthetic-research", "image-preferences", "video-preferences"]
dependencies = ["requests>=2.32.5,<3", "Pillow>=11.3,<13"]

[project.urls]
Homepage = "https://getminds.ai"
Registry = "https://registry.comfy.org/nodes/comfyui-minds"
Issues = "https://github.com/minds-ai-co/ComfyUI-Minds/issues"
Repository = "https://github.com/minds-ai-co/ComfyUI-Minds"
Documentation = "https://github.com/minds-ai-co/ComfyUI-Minds/blob/main/docs/usage.md"

[tool.comfy]
PublisherId = "minds"
DisplayName = "Minds for ComfyUI — Image & Video Preference Testing"
Icon = "https://getminds.ai/mcp-icon-light.png"
Banner = "https://raw.githubusercontent.com/minds-ai-co/ComfyUI-Minds/main/docs/images/workflow.png"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
